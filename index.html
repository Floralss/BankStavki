<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLACK — Форум проекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0b0a09;
    --bg-panel:#151210;
    --bg-panel-2:#1b1713;
    --bg-raised:#211c17;
    --line:#2c2620;
    --gold:#caa14b;
    --gold-bright:#e8c874;
    --gold-dim:#8a713a;
    --crimson:#7a2430;
    --crimson-bright:#a83545;
    --text:#ece6d8;
    --text-muted:#948c7c;
    --text-faint:#5f584b;
    --font-display:'Cinzel', serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(202,161,75,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(122,36,48,0.08), transparent 55%),
      var(--bg-void);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--gold-dim); color:#12100d;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-void);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

  .seal{
    width:34px; height:34px; border-radius:50%;
    background:conic-gradient(from 220deg, var(--gold-bright), var(--gold-dim), var(--gold-bright));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(0,0,0,0.5) inset, 0 2px 10px rgba(0,0,0,0.5);
    flex-shrink:0;
  }
  .seal span{
    width:26px; height:26px; border-radius:50%;
    background:var(--bg-void);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:12px; color:var(--gold-bright);
  }

  /* Top bar */
  header.topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
    background:rgba(11,10,9,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .name{
    font-family:var(--font-display); letter-spacing:0.14em; font-size:20px; font-weight:700;
    color:var(--text);
  }
  .brand .name em{color:var(--gold-bright); font-style:normal;}
  .brand .tag{font-size:11px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:14px;}

  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel-2); border:1px solid var(--line);
    color:var(--text-muted);
    transition:all .15s ease;
  }
  .icon-btn:hover{color:var(--gold-bright); border-color:var(--gold-dim); background:var(--bg-raised);}

  .btn{
    padding:10px 18px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text); font-weight:600; font-size:14px;
    transition:all .15s ease; letter-spacing:0.01em;
  }
  .btn:hover{border-color:var(--gold-dim); background:var(--bg-raised);}
  .btn-gold{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1509; border:none; font-weight:700;
  }
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border:1px solid var(--line);}
  .btn-danger{background:transparent; border:1px solid var(--crimson); color:var(--crimson-bright);}
  .btn-danger:hover{background:rgba(122,36,48,0.15);}
  .btn-sm{padding:6px 12px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  .user-chip{display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border-radius:30px; background:var(--bg-panel-2); border:1px solid var(--line); cursor:pointer;}
  .user-chip:hover{border-color:var(--gold-dim);}
  .avatar{width:30px; height:30px; border-radius:50%; object-fit:cover; background:var(--bg-raised); border:1px solid var(--line);}
  .user-chip .uname{font-size:13.5px; font-weight:700;}
  .rank-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10px; font-weight:800; letter-spacing:0.09em; text-transform:uppercase;
    padding:3px 9px; border-radius:20px;
    color:#12100d;
  }
  .rank-pill.outline{
    background:transparent; border:1px solid currentColor; padding:2px 8px;
  }

  /* Layout */
  .shell{max-width:1180px; margin:0 auto; padding:32px 24px 80px; display:grid; grid-template-columns:250px 1fr; gap:26px;}
  @media (max-width:860px){ .shell{grid-template-columns:1fr;} }

  .side-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:18px;
  }
  .side-card h3{font-family:var(--font-display); font-size:13px; letter-spacing:0.1em; color:var(--gold-bright); text-transform:uppercase; margin-bottom:14px;}
  .side-link{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px;
    color:var(--text-muted); font-size:13.5px; font-weight:600;
  }
  .side-link:hover{background:var(--bg-panel-2); color:var(--text);}
  .side-link.active{background:var(--bg-panel-2); color:var(--gold-bright);}

  .stat-row{display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); border-bottom:1px solid var(--line);}
  .stat-row:last-child{border:none;}
  .stat-row b{color:var(--text); font-weight:600;}

  .panel{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .panel-head h2{font-family:var(--font-display); font-size:16px; letter-spacing:0.05em;}
  .panel-head p{font-size:12.5px; color:var(--text-faint); margin-top:3px;}

  .cat-block{border-bottom:1px solid var(--line);}
  .cat-block:last-child{border-bottom:none;}
  .cat-head{display:flex; align-items:center; gap:12px; padding:16px 20px; background:var(--bg-panel-2);}
  .cat-head .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); flex-shrink:0;}
  .cat-head h4{font-size:14.5px; font-weight:800; letter-spacing:0.01em;}
  .cat-head p{font-size:12px; color:var(--text-faint); margin-top:2px;}

  .topic-row{
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-top:1px solid var(--line); transition:background .12s ease;
  }
  .topic-row:hover{background:var(--bg-panel-2);}
  .topic-row .flag{width:3px; align-self:stretch; border-radius:3px; background:transparent;}
  .topic-row.pinned .flag{background:var(--gold);}
  .topic-row.locked .flag{background:var(--crimson);}
  .topic-main{flex:1; min-width:0;}
  .topic-title{display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:700;}
  .topic-title .badge-mini{font-size:10px; font-weight:800; padding:1px 7px; border-radius:5px; letter-spacing:0.05em;}
  .badge-mini.pin{background:rgba(202,161,75,0.15); color:var(--gold-bright); border:1px solid var(--gold-dim);}
  .badge-mini.lock{background:rgba(122,36,48,0.15); color:var(--crimson-bright); border:1px solid var(--crimson);}
  .topic-meta{font-size:12px; color:var(--text-faint); margin-top:4px; display:flex; gap:6px; align-items:center;}
  .topic-stats{display:flex; gap:20px; font-family:var(--font-mono); font-size:12px; color:var(--text-muted); flex-shrink:0;}
  .topic-stats div{text-align:center;}
  .topic-stats b{display:block; color:var(--text); font-size:13.5px;}

  .empty{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}

  /* Topic thread */
  .post{display:flex; gap:16px; padding:18px 20px; border-top:1px solid var(--line);}
  .post:first-child{border-top:none;}
  .post-side{width:130px; flex-shrink:0; text-align:center;}
  .post-side .avatar-lg{width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--bg-raised); border:1px solid var(--line); margin-bottom:8px;}
  .post-side .uname{font-size:13px; font-weight:800;}
  .post-body{flex:1; min-width:0;}
  .post-time{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin-bottom:8px;}
  .post-content{font-size:14px; line-height:1.65; color:var(--text); white-space:pre-wrap; word-wrap:break-word;}
  .post-actions{margin-top:10px; display:flex; gap:8px;}

  textarea, input[type=text], input[type=email], input[type=password]{
    width:100%; background:var(--bg-void); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 13px; font-family:inherit; font-size:13.5px;
    outline:none; transition:border-color .15s ease;
  }
  textarea:focus, input:focus{border-color:var(--gold-dim);}
  textarea{min-height:110px; resize:vertical;}
  label.field-label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:6px; font-weight:700;}
  .field{margin-bottom:14px;}

  .composer{padding:18px 20px; border-top:1px solid var(--line); background:var(--bg-panel-2);}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(6,5,4,0.72); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; width:100%; max-width:420px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,0.6);}
  .modal.wide{max-width:640px;}
  .modal h2{font-family:var(--font-display); font-size:19px; margin-bottom:6px; letter-spacing:0.03em;}
  .modal .sub{font-size:12.5px; color:var(--text-faint); margin-bottom:20px;}
  .modal-close{position:absolute; margin-left:calc(100% - 30px); margin-top:-14px; width:28px; height:28px; border-radius:50%; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
  .divider-or{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-faint); font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em;}
  .divider-or::before, .divider-or::after{content:""; flex:1; height:1px; background:var(--line);}
  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1a1a1a; border:none; padding:11px; border-radius:8px; font-weight:700; font-size:13.5px;
  }
  .google-btn:hover{filter:brightness(0.96);}
  .switch-line{margin-top:16px; font-size:12.5px; color:var(--text-faint); text-align:center;}
  .switch-line a{color:var(--gold-bright); font-weight:700;}
  .error-msg{background:rgba(122,36,48,0.15); border:1px solid var(--crimson); color:var(--crimson-bright); font-size:12.5px; padding:9px 12px; border-radius:7px; margin-bottom:14px;}

  /* Admin */
  .admin-tabs{display:flex; gap:6px; padding:14px 20px 0; border-bottom:1px solid var(--line);}
  .admin-tab{padding:10px 14px; font-size:13px; font-weight:700; color:var(--text-faint); border-bottom:2px solid transparent;}
  .admin-tab.active{color:var(--gold-bright); border-color:var(--gold-bright);}
  .admin-body{padding:20px;}
  .admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:700px){.admin-grid{grid-template-columns:1fr;}}

  table.data{width:100%; border-collapse:collapse; font-size:13px;}
  table.data th{text-align:left; color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; padding:8px 10px; border-bottom:1px solid var(--line);}
  table.data td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.data tr:hover td{background:var(--bg-panel-2);}

  .perm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin:14px 0;}
  .perm-item{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted);}
  .perm-item input{width:15px; height:15px; accent-color:var(--gold);}

  .color-row{display:flex; gap:10px; align-items:center;}
  input[type=color]{width:44px; height:38px; border:1px solid var(--line); border-radius:8px; background:none; padding:2px;}

  .rank-card{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--bg-void);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg-raised); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px; border-radius:8px; font-size:13px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,0.5);}

  .loading-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg-void); z-index:500; flex-direction:column; gap:14px;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold-bright); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }

  .crumb{font-size:12.5px; color:var(--text-faint); margin-bottom:16px; display:flex; gap:6px; align-items:center;}
  .crumb a:hover{color:var(--gold-bright);}
</style>
</head>
<body>

<div id="loading" class="loading-screen"><div class="spinner"></div><div style="color:var(--text-faint); font-size:12.5px; letter-spacing:0.05em;">ЗАГРУЗКА BLACK…</div></div>

<header class="topbar">
  <a href="#/" class="brand">
    <div class="seal"><span>B</span></div>
    <div>
      <div class="name">BL<em>A</em>CK</div>
      <div class="tag">Форум проекта</div>
    </div>
  </a>
  <div class="topbar-right" id="topbarRight"></div>
</header>

<div id="root" class="shell" style="display:none;"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getAnalytics, isSupported as analyticsSupported } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
import {
  getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, orderBy, where, onSnapshot, serverTimestamp, increment, limit
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

// ---------------------------------------------------------------------------
// Firebase config (provided project)
// ---------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyBGFONUBgybQr0KCn_Ao_ZT9HkWVSU4jEw",
  authDomain: "black-social-af844.firebaseapp.com",
  projectId: "black-social-af844",
  storageBucket: "black-social-af844.firebasestorage.app",
  messagingSenderId: "296441938682",
  appId: "1:296441938682:web:096a3e642bd00116f7bf43",
  measurementId: "G-2PX2QMR8HS"
};

const OWNER_EMAIL = "strepoomich27@gmail.com";

const app = initializeApp(firebaseConfig);
analyticsSupported().then(ok => { if (ok) { try { getAnalytics(app); } catch(e) {} } });
const auth = getAuth(app);
const db = getFirestore(app);

// ---------------------------------------------------------------------------
// Tiny state / render helpers
// ---------------------------------------------------------------------------
const state = {
  user: null,          // firebase auth user
  profile: null,       // users/{uid} doc data
  ranks: [],           // all rank docs, sorted by order
  ranksById: {},
  categories: [],
  topicsByCat: {},      // catId -> array of topics (latest loaded)
  authReady: false,
};

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function timeAgo(ts){
  if(!ts) return "только что";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime())/1000);
  if(s < 60) return "только что";
  if(s < 3600) return Math.floor(s/60) + " мин. назад";
  if(s < 86400) return Math.floor(s/3600) + " ч. назад";
  if(s < 2592000) return Math.floor(s/86400) + " дн. назад";
  return d.toLocaleDateString("ru-RU", {day:"numeric", month:"short", year:"numeric"});
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(()=> el.remove(), 3200);
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function openModal(html){ document.getElementById("modalRoot").innerHTML =
  `<div class="overlay" id="ovl">${html}</div>`;
  document.getElementById("ovl").addEventListener("click", e => { if(e.target.id === "ovl") closeModal(); });
}

const DEFAULT_PERMS = {
  admin:false, manageRanks:false, manageUsers:false, manageCategories:false,
  pinTopics:false, lockTopics:false, deleteAnyPost:false, banUsers:false
};
const PERM_LABELS = {
  admin:"Полный доступ (владелец)", manageRanks:"Управление рангами",
  manageUsers:"Управление участниками", manageCategories:"Управление разделами",
  pinTopics:"Закреплять темы", lockTopics:"Закрывать темы",
  deleteAnyPost:"Удалять любые сообщения", banUsers:"Блокировать участников"
};

function myPerms(){
  if(!state.profile) return DEFAULT_PERMS;
  if(state.user && state.user.email === OWNER_EMAIL) return {admin:true,manageRanks:true,manageUsers:true,manageCategories:true,pinTopics:true,lockTopics:true,deleteAnyPost:true,banUsers:true};
  const rank = state.ranksById[state.profile.rankId];
  return (rank && rank.permissions) ? {...DEFAULT_PERMS, ...rank.permissions} : DEFAULT_PERMS;
}
function hasAnyAdminAccess(){
  const p = myPerms();
  return p.admin || p.manageRanks || p.manageUsers || p.manageCategories;
}

function rankOf(uidProfile){
  const rid = uidProfile && uidProfile.rankId;
  return state.ranksById[rid] || {name:"Участник", color:"#5f584b", permissions:{}};
}
function rankPillHtml(rank, small){
  const c = rank.color || "#5f584b";
  return `<span class="rank-pill" style="background:${c};">${escapeHtml(rank.name || "Участник")}</span>`;
}

// ---------------------------------------------------------------------------
// Bootstrap: ensure owner + default ranks exist, ensure user profile doc
// ---------------------------------------------------------------------------
async function ensureBootstrapRanks(){
  const snap = await getDocs(collection(db, "ranks"));
  if(!snap.empty) return;
  // Only proceed to seed if nobody is authenticated yet or current user is owner —
  // Firestore rules ultimately gate this; this call is a no-op if denied.
  try{
    await setDoc(doc(db, "ranks", "owner"), {
      name: "Владелец", color: "#e8c874", order: 0,
      permissions: {admin:true,manageRanks:true,manageUsers:true,manageCategories:true,pinTopics:true,lockTopics:true,deleteAnyPost:true,banUsers:true},
      createdAt: serverTimestamp()
    });
    await setDoc(doc(db, "ranks", "member"), {
      name: "Участник", color: "#6b6558", order: 100,
      permissions: {...DEFAULT_PERMS},
      createdAt: serverTimestamp()
    });
  }catch(e){ /* rules may block non-owner; ignore */ }
}

async function ensureUserProfile(user){
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    const isOwner = user.email === OWNER_EMAIL;
    await setDoc(ref, {
      displayName: user.displayName || user.email.split("@")[0],
      email: user.email,
      photoURL: user.photoURL || "",
      rankId: isOwner ? "owner" : "member",
      createdAt: serverTimestamp()
    });
  } else if(user.email === OWNER_EMAIL && snap.data().rankId !== "owner"){
    await updateDoc(ref, {rankId:"owner"});
  }
}

// ---------------------------------------------------------------------------
// Live listeners
// ---------------------------------------------------------------------------
function listenRanks(){
  onSnapshot(query(collection(db,"ranks"), orderBy("order","asc")), snap => {
    state.ranks = snap.docs.map(d => ({id:d.id, ...d.data()}));
    state.ranksById = Object.fromEntries(state.ranks.map(r => [r.id, r]));
    render();
  });
}
function listenCategories(){
  onSnapshot(query(collection(db,"categories"), orderBy("order","asc")), snap => {
    state.categories = snap.docs.map(d => ({id:d.id, ...d.data()}));
    state.categories.forEach(cat => listenTopicsForCategory(cat.id));
    render();
  });
}
const topicListeners = {};
function listenTopicsForCategory(catId){
  if(topicListeners[catId]) return;
  topicListeners[catId] = onSnapshot(
    query(collection(db,"topics"), where("categoryId","==",catId), orderBy("lastReplyAt","desc"), limit(50)),

// Auth actions

async function doGoogleSignIn(){
  const provider = new GoogleAuthProvider();
  try{
    await signInWithPopup(auth, provider);
    closeModal();
  }catch(e){ showAuthError(e); }
}
async function doEmailAuth(mode, email, password, name){
  try{
    if(mode === "register"){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if(name) await updateProfile(cred.user, {displayName:name});
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
    closeModal();
  }catch(e){ showAuthError(e); }
}
function showAuthError(e){
  const box = document.getElementById("authErr");
  const map = {
    "auth/email-already-in-use":"Этот email уже зарегистрирован.",
    "auth/invalid-email":"Некорректный email.",
    "auth/weak-password":"Пароль слишком простой (минимум 6 символов).",
    "auth/invalid-credential":"Неверный email или пароль.",
    "auth/popup-closed-by-user":"Окно входа Google было закрыто.",
    "auth/unauthorized-domain":"Этот домен не разрешён в настройках Firebase Authentication (Authorized domains)."
  };
  const msg = map[e.code] || e.message || "Произошла ошибка.";
  if(box){ box.style.display="block"; box.textContent = msg; }
  else toast(msg);
}

function openAuthModal(mode){
  mode = mode || "login";
  openModal(`
    <div class="modal" style="position:relative;">
      <button class="modal-close" onclick="window.__closeModal()">✕</button>
      <h2>${mode === "login" ? "Вход в BLACK" : "Регистрация"}</h2>
      <div class="sub">${mode === "login" ? "Войдите, чтобы участвовать в жизни форума" : "Создайте аккаунт участника"}</div>
      <div id="authErr" class="error-msg" style="display:none;"></div>
      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Продолжить с Google
      </button>
      <div class="divider-or">или email</div>
      ${mode === "register" ? `<div class="field"><label class="field-label">Имя</label><input type="text" id="regName" placeholder="Ваш ник"></div>` : ""}
      <div class="field"><label class="field-label">Email</label><input type="email" id="authEmail" placeholder="you@mail.com"></div>
      <div class="field"><label class="field-label">Пароль</label><input type="password" id="authPass" placeholder="••••••••"></div>
      <button class="btn btn-gold" style="width:100%;" id="authSubmit">${mode === "login" ? "Войти" : "Создать аккаунт"}</button>
      <div class="switch-line">
        ${mode === "login" ? `Нет аккаунта? <a href="#" id="toRegister">Зарегистрироваться</a>` : `Уже есть аккаунт? <a href="#" id="toLogin">Войти</a>`}
      </div>
    </div>
  `);
  document.getElementById("googleBtn").onclick = doGoogleSignIn;
  document.getElementById("authSubmit").onclick = () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    const name = mode === "register" ? document.getElementById("regName").value.trim() : null;
    if(!email || !pass) return showAuthError({message:"Заполните email и пароль."});
    doEmailAuth(mode === "register" ? "register" : "login", email, pass, name);
  };
  const toReg = document.getElementById("toRegister");
  const toLog = document.getElementById("toLogin");
  if(toReg) toReg.onclick = (e) => { e.preventDefault(); openAuthModal("register"); };
  if(toLog) toLog.onclick = (e) => { e.preventDefault(); openAuthModal("login"); };
}
window.__closeModal = closeModal;

// Topic / post actions

async function createTopic(categoryId, title, firstPost){
  if(!state.user) return toast("Войдите, чтобы создать тему.");
  if(!title.trim() || !firstPost.trim()) return toast("Заполните заголовок и текст.");
  const topicRef = await addDoc(collection(db,"topics"), {
    categoryId, title: title.trim(), authorId: state.user.uid,
    authorName: state.profile?.displayName || state.user.email,
    createdAt: serverTimestamp(), lastReplyAt: serverTimestamp(),
    pinned:false, locked:false, repliesCount:0
  });
  await addDoc(collection(db,"posts"), {
    topicId: topicRef.id, authorId: state.user.uid,
    authorName: state.profile?.displayName || state.user.email,
    content: firstPost.trim(), createdAt: serverTimestamp()
  });
  location.hash = "#/topic/" + topicRef.id;
  closeModal();
}
async function replyTopic(topicId, content){
  if(!state.user) return toast("Войдите, чтобы ответить.");
  if(!content.trim()) return;
  await addDoc(collection(db,"posts"), {
    topicId, authorId: state.user.uid,
    authorName: state.profile?.displayName || state.user.email,
    content: content.trim(), createdAt: serverTimestamp()
  });
  await updateDoc(doc(db,"topics",topicId), {lastReplyAt: serverTimestamp(), repliesCount: increment(1)});
}
async function togglePin(topic){
  await updateDoc(doc(db,"topics",topic.id), {pinned: !topic.pinned});
}
async function toggleLock(topic){
  await updateDoc(doc(db,"topics",topic.id), {locked: !topic.locked});
}
async function deletePost(postId){
  if(!confirm("Удалить сообщение?")) return;
  await deleteDoc(doc(db,"posts",postId));
}

async function saveCategory(id, data){
  if(id) await updateDoc(doc(db,"categories",id), data);
  else await addDoc(collection(db,"categories"), {...data, order: state.categories.length});
}
async function deleteCategory(id){
  if(!confirm("Удалить раздел? Темы внутри останутся видимыми, но без раздела.")) return;
  await deleteDoc(doc(db,"categories",id));

async function saveRank(id, data){

}

let currentTopicUnsub = null, currentTopicPosts = [];
function viewTopic(topicId){
  if(currentTopicUnsub) { currentTopicUnsub(); currentTopicUnsub = null; }
  let topicMeta = null;
  getDoc(doc(db,"topics",topicId)).then(s => { topicMeta = s.exists() ? {id:s.id,...s.data()} : null; renderTopicShell(); });
  currentTopicUnsub = onSnapshot(query(collection(db,"posts"), where("topicId","==",topicId), orderBy("createdAt","asc")), snap => {
    currentTopicPosts = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderTopicShell();
  });
  function renderTopicShell(){
    const root = document.getElementById("root");
    if(route() !== "/topic/"+topicId) return;
    const cat = topicMeta ? state.categories.find(c=>c.id===topicMeta.categoryId) : null;
    root.innerHTML = `
      ${viewSidebar()}
      <div>
        <div class="crumb"><a href="#/">Форум</a> ${cat ? `→ <a href="#/">${escapeHtml(cat.name)}</a>` : ""} → <span>${topicMeta ? escapeHtml(topicMeta.title) : "…"}</span></div>
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>${topicMeta ? escapeHtml(topicMeta.title) : "Загрузка…"}</h2>
              <p>${topicMeta ? escapeHtml(topicMeta.authorName||"") + " · " + timeAgo(topicMeta.createdAt) : ""}</p>
            </div>
            ${topicMeta && (myPerms().pinTopics || myPerms().lockTopics) ? `
              <div style="display:flex; gap:8px;">
                ${myPerms().pinTopics ? `<button class="btn btn-sm btn-ghost" id="pinBtn">${topicMeta.pinned?"Открепить":"Закрепить"}</button>`:""}
                ${myPerms().lockTopics ? `<button class="btn btn-sm btn-ghost" id="lockBtn">${topicMeta.locked?"Открыть":"Закрыть"}</button>`:""}
              </div>` : ""}
          </div>
          ${currentTopicPosts.map(p => `
            <div class="post">
              <div class="post-side">
                <div class="avatar-lg" style="display:flex;align-items:center;justify-content:center; font-weight:800; color:var(--gold-bright); font-size:22px;">${escapeHtml((p.authorName||"?").slice(0,1).toUpperCase())}</div>
                <div class="uname">${escapeHtml(p.authorName||"")}</div>
              </div>
              <div class="post-body">
                <div class="post-time">${timeAgo(p.createdAt)}</div>
                <div class="post-content">${escapeHtml(p.content)}</div>
                ${(state.user && (state.user.uid === p.authorId || myPerms().deleteAnyPost)) ? `
                  <div class="post-actions"><button class="btn btn-sm btn-danger del-post" data-id="${p.id}">Удалить</button></div>
                ` : ""}
              </div>
            </div>
          `).join("")}
          <div class="composer">
            ${!state.user ? `<div style="color:var(--text-faint); font-size:13px;">Войдите, чтобы ответить в теме.</div>`
              : (topicMeta && topicMeta.locked && !myPerms().lockTopics) ? `<div style="color:var(--text-faint); font-size:13px;">Тема закрыта для новых ответов.</div>`
              : `
              <textarea id="replyBox" placeholder="Ваш ответ…"></textarea>
              <div style="margin-top:10px; display:flex; justify-content:flex-end;">
                <button class="btn btn-gold btn-sm" id="replyBtn">Ответить</button>
              </div>`}
          </div>
        </div>
      </div>
    `;
    const replyBtn = document.getElementById("replyBtn");
    if(replyBtn) replyBtn.onclick = async () => {
      const box = document.getElementById("replyBox");
      await replyTopic(topicId, box.value);
      box.value = "";
    };
    const pinBtn = document.getElementById("pinBtn");
    if(pinBtn) pinBtn.onclick = () => togglePin(topicMeta);
    const lockBtn = document.getElementById("lockBtn");
    if(lockBtn) lockBtn.onclick = () => toggleLock(topicMeta);
    root.querySelectorAll(".del-post").forEach(b => b.onclick = () => deletePost(b.dataset.id));
  }
}

      </div>
      ${state.ranks.map(r => `
        <div class="rank-card">
          <div style="display:flex; align-items:center; gap:12px;">
            ${rankPillHtml(r)}
            <span style="font-size:12px; color:var(--text-faint); font-family:var(--font-mono);">
              ${Object.entries(r.permissions||{}).filter(([,v])=>v).map(([k])=>PERM_LABELS[k]||k).join(", ") || "без особых прав"}
            </span>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm btn-ghost edit-rank" data-id="${r.id}">Изменить</button>
            ${r.id!=='owner' ? `<button class="btn btn-sm btn-danger del-rank" data-id="${r.id}">Удалить</button>`:""}
          </div>
        </div>
      `).join("") || `<div class="empty">Рангов ещё нет.</div>`}
    `;
    document.getElementById("newRankBtn").onclick = () => openRankModal(null);
    body.querySelectorAll(".edit-rank").forEach(b => b.onclick = () => openRankModal(state.ranks.find(r=>r.id===b.dataset.id)));
    body.querySelectorAll(".del-rank").forEach(b => b.onclick = () => deleteRank(b.dataset.id));
  } else if(adminTab === "users"){
    body.innerHTML = `
      <table class="data">
        <thead><tr><th>Участник</th><th>Email</th><th>Текущий ранг</th><th>Назначить ранг</th></tr></thead>
        <tbody>
          ${allUsersCache.map(u => `
            <tr>
              <td>${escapeHtml(u.displayName||"—")}</td>
              <td style="color:var(--text-faint); font-family:var(--font-mono); font-size:11.5px;">${escapeHtml(u.email||"")}</td>
              <td>${rankPillHtml(rankOf(u))}</td>
              <td>
                <select data-uid="${u.id}" class="rank-select" ${u.email===OWNER_EMAIL?'disabled':''} style="background:var(--bg-void); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12.5px;">
                  ${state.ranks.map(r => `<option value="${r.id}" ${u.rankId===r.id?'selected':''}>${escapeHtml(r.name)}</option>`).join("")}
                </select>
              </td>
            </tr>
          `).join("") || `<tr><td colspan="4" class="empty">Нет участников.</td></tr>`}
        </tbody>
      </table>
    `;
    body.querySelectorAll(".rank-select").forEach(sel => sel.onchange = async () => {
      await assignRank(sel.dataset.uid, sel.value);
      await loadAllUsers(); renderAdminBody();
    });
  } else if(adminTab === "categories"){
    body.innerHTML = `
      <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
        <button class="btn btn-gold btn-sm" id="newCatBtn2">+ Новый раздел</button>
      </div>
      ${state.categories.map(c => `
        <div class="rank-card">
          <div><b>${escapeHtml(c.name)}</b><div style="font-size:12px; color:var(--text-faint);">${escapeHtml(c.description||"")}</div></div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm btn-ghost edit-cat" data-id="${c.id}">Изменить</button>
            <button class="btn btn-sm btn-danger del-cat" data-id="${c.id}">Удалить</button>
          </div>
        </div>
      `).join("") || `<div class="empty">Разделов ещё нет.</div>`}
    `;
    document.getElementById("newCatBtn2").onclick = () => openCategoryModal(null);
    body.querySelectorAll(".edit-cat").forEach(b => b.onclick = () => openCategoryModal(state.categories.find(c=>c.id===b.dataset.id)));
    body.querySelectorAll(".del-cat").forEach(b => b.onclick = () => deleteCategory(b.dataset.id));
  }
}

// ---------------------------------------------------------------------------
// Main render
// ---------------------------------------------------------------------------
function render(){
  if(!state.authReady) return;
  document.getElementById("loading").style.display = "none";
  document.getElementById("root").style.display = "grid";
  viewTopbarRight();
  const r = route();
  if(r === "/" ) {
    document.getElementById("root").innerHTML = viewForumList();
    document.querySelectorAll(".new-topic-btn").forEach(b => b.onclick = () => openNewTopicModal(b.dataset.cat));
    const newCatBtn = document.getElementById("newCatBtn");
    if(newCatBtn) newCatBtn.onclick = () => openCategoryModal(null);
  } else if(r.startsWith("/topic/")) {
    viewTopic(r.split("/topic/")[1]);
  } else if(r === "/admin") {
    viewAdmin();
  } else {
    document.getElementById("root").innerHTML = `${viewSidebar()}<div class="panel"><div class="empty">Страница не найдена.</div></div>`;
  }
}

// ---------------------------------------------------------------------------
// Auth lifecycle
// ---------------------------------------------------------------------------
let profileUnsub = null;
onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if(profileUnsub){ profileUnsub(); profileUnsub = null; }
  if(user){
    await ensureBootstrapRanks();
    await ensureUserProfile(user);
    profileUnsub = listenProfile(user.uid);
  } else {
    state.profile = null;
  }
  state.authReady = true;
  render();
});

listenRanks();
listenCategories();
</script>
</body>
</html>

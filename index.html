<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK SOCIAL — Форум</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">⬛</span>
        <span class="logo-text">BLACK<span class="accent">SOCIAL</span></span>
      </a>
      <nav class="nav" id="mainNav">
        <a href="index.html" class="nav-link active">Форум</a>
        <a href="#" class="nav-link" id="profileLink" style="display:none;">Профиль</a>
        <a href="admin.html" class="nav-link" id="adminLink" style="display:none;">Админ-панель</a>
      </nav>
      <div class="header-actions" id="headerActions">
        <button class="btn btn-outline" id="loginBtn">Войти</button>
        <button class="btn btn-primary" id="registerBtn">Регистрация</button>
      </div>
      <div class="user-menu" id="userMenu" style="display:none;">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userName">User</div>
          <div class="user-badge" id="userBadge">Новичок</div>
        </div>
        <button class="btn-icon" id="logoutBtn" title="Выйти">⎋</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="container">
      <!-- Welcome Banner -->
      <section class="hero" id="heroSection">
        <div class="hero-content">
          <h1>Добро пожаловать в <span class="accent">BLACK SOCIAL</span></h1>
          <p>Форум в стиле Black. Общение, RolePlay, сообщества.</p>
        </div>
      </section>

      <!-- Forum Categories -->
      <section class="forum-section">
        <div class="section-header">
          <h2>Разделы форума</h2>
          <button class="btn btn-primary" id="createTopicBtn" style="display:none;">+ Создать тему</button>
        </div>

        <div class="categories" id="categoriesList">
          <!-- Categories will be loaded here -->
          <div class="loading">Загрузка разделов...</div>
        </div>
      </section>

      <!-- Recent Topics -->
      <section class="forum-section">
        <div class="section-header">
          <h2>Последние темы</h2>
        </div>
        <div class="topics-list" id="topicsList">
          <div class="loading">Загрузка тем...</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">×</button>
      <div class="auth-tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
        <div class="divider"><span>или</span></div>
        <button type="button" class="btn btn-google btn-block" id="googleLoginBtn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.96-2.184l-2.908-2.258c-.806.54-1.837.86-3.052.86-2.347 0-4.33-1.584-5.04-3.715H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.703c-.18-.54-.282-1.117-.282-1.703 0-.586.102-1.163.282-1.703V4.965H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.035l3.003-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.965L3.96 7.297C4.67 5.163 6.653 3.58 9 3.58z"/></svg>
          Войти через Google
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display:none;">
        <div class="form-group">
          <label>Никнейм</label>
          <input type="text" id="regNickname" required placeholder="Maks_Deep" minlength="3" maxlength="20">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
        <div class="divider"><span>или</span></div>
        <button type="button" class="btn btn-google btn-block" id="googleRegisterBtn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.96-2.184l-2.908-2.258c-.806.54-1.837.86-3.052.86-2.347 0-4.33-1.584-5.04-3.715H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.96 10.703c-.18-.54-.282-1.117-.282-1.703 0-.586.102-1.163.282-1.703V4.965H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.035l3.003-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.965L3.96 7.297C4.67 5.163 6.653 3.58 9 3.58z"/></svg>
          Зарегистрироваться через Google
        </button>
      </form>
    </div>
  </div>

  <!-- Create Topic Modal -->
  <div class="modal" id="topicModal">
    <div class="modal-content">
      <button class="modal-close" id="closeTopicModal">×</button>
      <h2>Создать новую тему</h2>
      <form id="createTopicForm">
        <div class="form-group">
          <label>Раздел</label>
          <select id="topicCategory" required></select>
        </div>
        <div class="form-group">
          <label>Заголовок</label>
          <input type="text" id="topicTitle" required maxlength="100" placeholder="Название темы">
        </div>
        <div class="form-group">
          <label>Содержание</label>
          <textarea id="topicContent" required rows="6" placeholder="Текст сообщения..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Опубликовать</button>
      </form>
    </div>
  </div>

  <!-- Topic View Modal / Page -->
  <div class="modal modal-lg" id="viewTopicModal">
    <div class="modal-content">
      <button class="modal-close" id="closeViewTopic">×</button>
      <div id="topicViewContent">
        <!-- Topic content loaded here -->
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toastContainer"></div>

  <!-- Firebase + App Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
